<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a4c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cheiro-verde">
<title>Cheiro-verde · Vendas e lucro</title>
<style>
:root{--bg:#f4f7f3;--card:#fff;--tx:#17301f;--mu:#667a6c;--bd:#dfe8e0;--pr:#1f8a4c;--prt:#fff;--ok:#1f8a4c;--wa:#b4531a;--rd:#c0392b;--sh:0 1px 3px rgba(0,0,0,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17251c;--tx:#e6f1e8;--mu:#8fa596;--bd:#26382c;--pr:#3ec978;--prt:#08210f;--ok:#3ec978;--wa:#f0a060;--rd:#ff7b6b;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#17251c;--tx:#e6f1e8;--mu:#8fa596;--bd:#26382c;--pr:#3ec978;--prt:#08210f;--ok:#3ec978;--wa:#f0a060;--rd:#ff7b6b;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.sub{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.card .l{font-size:12px;color:var(--mu)}.card .v{font-size:22px;font-weight:700;margin-top:2px}
.fat .v{color:var(--tx)}.luc .v{color:var(--ok)}.cus .v{color:var(--wa)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sale{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sale .t{font-weight:600}.sale .m{font-size:12px;color:var(--mu)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--pr);color:var(--prt);cursor:pointer}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.d{color:var(--rd)}
.btn.full{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 6px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
input{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:10px;padding:4px 0;cursor:pointer;min-width:0;line-height:1.2}
nav button.on{color:var(--pr);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.prev{display:flex;gap:8px;margin:12px 0}.prev div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12px;color:var(--mu)}.prev b{display:block;font-size:15px;color:var(--tx)}
.err{color:var(--rd);font-size:13px;margin-top:8px;min-height:18px}
.low{color:var(--rd)}
.empty{color:var(--mu);text-align:center;padding:18px;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var K="cheiro-verde-v1",TAB="home",HF={mode:"day",date:"",pay:"all"},MODAL=null;
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function seed(){return{price:200,sales:[{id:uid(),date:"2026-11-01",time:"07:17",qty:1,amount:200,pay:"dinheiro"}],stock:[{id:uid(),date:"2026-11-01",qty:40,type:"initial"}]}}
var S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
if(!S||!S.sales){S=seed()}
if(!S.expenses)S.expenses=[];
if(!S.wallet)S.wallet=[];
if(!S.jobs)S.jobs=[];
if(!S.loans)S.loans=[];
if(!S.debts)S.debts=[];
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function R(c){return(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function cost(a){return Math.round(a*0.5)}
function profit(a){return a-cost(a)}
function money(s){var n=parseFloat(String(s).replace(/\./g,"").replace(",","."));if(isNaN(n))n=parseFloat(String(s).replace(",","."));return isNaN(n)?NaN:Math.round(n*100)}
function stock(){var a=0;S.stock.forEach(function(m){a+=m.qty});S.sales.forEach(function(s){a-=s.qty});return a}
function fd(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function addDays(d,n){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function range(mode,d){
 if(mode==="day")return[d,d];
 if(mode==="week"){var w=new Date(d+"T12:00:00").getDay();var m=addDays(d,-((w+6)%7));return[m,addDays(m,6)]}
 if(mode==="month"){var p=d.split("-");var last=new Date(+p[0],+p[1],0).getDate();return[p[0]+"-"+p[1]+"-01",p[0]+"-"+p[1]+"-"+String(last).padStart(2,"0")]}
 return["0000-00-00","9999-99-99"]}
function totals(list){var t={n:0,q:0,f:0,c:0,l:0,din:0,pix:0};list.forEach(function(s){t.n++;t.q+=s.qty;t.f+=s.amount;t.c+=cost(s.amount);t.l+=profit(s.amount);if(s.pay==="pix")t.pix+=s.amount;else t.din+=s.amount});return t}
function sorted(list){return list.slice().sort(function(a,b){return(b.date+b.time)<(a.date+a.time)?-1:1})}
function payLbl(p){return p==="pix"?"Pix":"Dinheiro"}
function saleHTML(s){return'<div class="sale"><div class="row"><div><div class="t">'+s.qty+(s.qty>1?" maços":" maço")+" · "+R(s.amount)+'</div><div class="m">'+fd(s.date)+" às "+s.time+' · Custo '+R(cost(s.amount))+' · Lucro '+R(profit(s.amount))+'</div></div><span class="tag">'+payLbl(s.pay)+'</span></div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn s sm" onclick="openSale(\''+s.id+'\')">Editar</button><button class="btn s sm d" onclick="delSale(\''+s.id+'\')">Excluir</button></div></div>'}
function cards(t,st,e){e=e||0;return'<div class="grid"><div class="card fat"><div class="l">Faturamento</div><div class="v">'+R(t.f)+'</div></div><div class="card luc"><div class="l">Lucro</div><div class="v">'+R(t.l)+'</div></div><div class="card cus"><div class="l">Custos</div><div class="v">'+R(t.c)+'</div></div><div class="card"><div class="l">Maços vendidos</div><div class="v">'+t.q+'</div></div><div class="card cus"><div class="l">Custos extras</div><div class="v">'+R(e)+'</div></div><div class="card luc"><div class="l">Lucro após custos extras</div><div class="v">'+R(t.l-e)+'</div></div>'+(st?'<div class="card" style="grid-column:span 2"><div class="l">Estoque atual</div><div class="v'+(stock()<=5?" low":"")+'">'+stock()+' maços</div></div>':"")+'</div>'}
function render(){
 var h="";
 if(TAB==="home"){
  var td=today(),list=sorted(S.sales.filter(function(s){return s.date===td})),t=totals(list);
  var el=S.expenses.filter(function(x){return x.date===td}),et=sumE(el);h='<h1>🌿 Cheiro-verde</h1><div class="sub">Hoje, '+fd(td)+'</div>'+cards(t,true,et)+'<button class="btn s full" style="margin-top:10px" onclick="openExp()">+ Adicionar custo (sacola etc.)</button><h2>Vendas de hoje ('+t.n+')</h2>'+(list.length?list.map(saleHTML).join(""):'<div class="empty">Nenhuma venda hoje ainda.</div>')+'<h2>Custos extras de hoje ('+el.length+')</h2>'+(el.length?el.map(expHTML).join(""):'<div class="empty">Nenhum custo extra hoje.</div>');
  h+='<button class="btn fab" onclick="openSale()">+ Nova venda</button>'}
 if(TAB==="hist"){
  if(!HF.date)HF.date=today();
  var r=range(HF.mode,HF.date),list=sorted(S.sales.filter(function(s){return s.date>=r[0]&&s.date<=r[1]&&(HF.pay==="all"||s.pay===HF.pay)})),t=totals(list),el=HF.pay==="all"?S.expenses.filter(function(x){return x.date>=r[0]&&x.date<=r[1]}):[],et=sumE(el);
  var modes=[["day","Dia"],["week","Semana"],["month","Mês"],["all","Tudo"]],pays=[["all","Todas"],["dinheiro","Dinheiro"],["pix","Pix"]];
  h='<h1>Histórico e relatórios</h1><div class="seg">'+modes.map(function(m){return'<button class="'+(HF.mode===m[0]?"on":"")+'" onclick="HF.mode=\''+m[0]+'\';render()">'+m[1]+'</button>'}).join("")+'</div>';
  if(HF.mode!=="all")h+='<input type="date" value="'+HF.date+'" onchange="HF.date=this.value||today();render()">';
  h+='<div class="sub" style="margin:6px 0">'+(HF.mode==="all"?"Todo o período":fd(r[0])+(r[0]!==r[1]?" a "+fd(r[1]):""))+'</div><div class="seg">'+pays.map(function(m){return'<button class="'+(HF.pay===m[0]?"on":"")+'" onclick="HF.pay=\''+m[0]+'\';render()">'+m[1]+'</button>'}).join("")+'</div>'+cards(t,false,et)+'<button class="btn s full" style="margin-top:10px" onclick="openExp()">+ Adicionar custo</button><div class="sub" style="margin-top:8px">'+t.n+' vendas · Dinheiro '+R(t.din)+' · Pix '+R(t.pix)+'</div><h2>Vendas</h2>'+(list.length?list.map(saleHTML).join(""):'<div class="empty">Nenhuma venda neste filtro.</div>')+(el.length?'<h2>Custos extras</h2>'+el.map(expHTML).join(""):"")}
 if(TAB==="stock"){
  var ini=S.stock.filter(function(m){return m.type==="initial"})[0];
  h='<h1>Estoque</h1><div class="card" style="margin-top:12px"><div class="l">Estoque atual</div><div class="v'+(stock()<=5?" low":"")+'" style="font-size:30px">'+stock()+' maços</div></div>'+
  '<h2>Quantidade inicial</h2><div class="row"><input id="ini" type="number" min="0" inputmode="numeric" value="'+(ini?ini.qty:"")+'" placeholder="Ex.: 40"><button class="btn" onclick="setIni()">Salvar</button></div>'+
  '<h2>Registrar reposição</h2><div class="row"><input id="rep" type="number" min="1" inputmode="numeric" placeholder="Maços repostos"><button class="btn" onclick="addRep()">Adicionar</button></div>'+
  '<h2>Preço padrão por maço</h2><div class="row"><input id="pr" inputmode="decimal" value="'+(S.price/100).toFixed(2).replace(".",",")+'"><button class="btn" onclick="setPrice()">Salvar</button></div><div class="err" id="serr"></div>'+
  '<h2>Movimentações</h2>'+(S.stock.length?S.stock.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(m){return'<div class="sale"><div class="row"><div><div class="t">+'+m.qty+' maços</div><div class="m">'+fd(m.date)+" · "+(m.type==="initial"?"Quantidade inicial":"Reposição")+'</div></div>'+(m.type==="restock"?'<button class="btn s sm d" onclick="delRep(\''+m.id+'\')">Excluir</button>':"")+'</div></div>'}).join(""):'<div class="empty">Sem movimentações.</div>')+backupHTML()}
 if(TAB==="wallet"){var w=walT(),wl=S.wallet.slice().reverse().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});h='<h1>👛 Carteira</h1><div class="grid" style="margin-top:12px"><div class="card"><div class="l">💵 Em espécie</div><div class="v'+(w.es<0?" low":"")+'">'+R(w.es)+'</div></div><div class="card"><div class="l">📲 Pix</div><div class="v'+(w.px<0?" low":"")+'">'+R(w.px)+'</div></div></div><div class="card" style="margin-top:10px"><div class="l">Total</div><div class="v'+(w.s<0?" low":"")+'" style="font-size:32px">'+R(w.s)+'</div></div><div class="grid"><button class="btn" onclick="openWal(\'in\')">+ Dinheiro</button><button class="btn s d" onclick="openWal(\'out\')">− Gasto</button></div><h2>De onde vem o saldo</h2><div class="card">'+wr("Lucro das vendas","+ "+R(w.l))+wr("Custos extras (sacola etc.)","− "+R(w.e))+wr("Dinheiro adicionado","+ "+R(w.i))+wr("Gastos","− "+R(w.o))+'</div><h2>Movimentações</h2>'+(wl.length?wl.map(wHTML).join(""):'<div class="empty">Nenhuma entrada ou gasto lançado ainda.</div>')}
if(TAB==="jobs"){var pj=S.jobs.filter(function(j){return j.status==="pend"}),dj=S.jobs.filter(function(j){return j.status==="done"}),jl=S.jobs.filter(function(j){return JF==="all"||j.status===JF}).reverse(),jf=[["pend","Pendentes"],["done","Concluídos"],["canc","Cancelados"],["all","Todos"]];h='<h1>💻 Informática</h1><div class="sub">Manutenção, limpeza, pasta térmica e mais</div><div class="grid"><div class="card"><div class="l">A receber ('+pj.length+')</div><div class="v">'+R(sumE(pj))+'</div></div><div class="card luc"><div class="l">Recebido ('+dj.length+')</div><div class="v">'+R(sumE(dj))+'</div></div></div><button class="btn full" style="margin-top:10px" onclick="openJob()">+ Novo serviço</button><div class="seg" style="margin-top:10px">'+jf.map(function(m){return'<button class="'+(JF===m[0]?"on":"")+'" onclick="JF=\''+m[0]+'\';render()">'+m[1]+'</button>'}).join("")+'</div>'+(jl.length?jl.map(jobHTML).join(""):'<div class="empty">Nenhum serviço aqui.</div>')}
if(TAB==="loans"){var td2=today(),ap=0,at=0,rc=0,dv=LK==="debts";LS().forEach(function(l){l.parcels.forEach(function(p){if(p.paid)rc+=p.amount;else{ap+=p.amount;if(p.due<td2)at+=p.amount}})});h='<h1>💸 Empréstimos</h1><div class="seg"><button class="'+(!dv?"on":"")+'" onclick="LK=\'loans\';render()">Me devem</button><button class="'+(dv?"on":"")+'" onclick="LK=\'debts\';render()">Eu devo</button></div><div class="sub">'+(dv?"Quem você está devendo":"Quem está te devendo")+'</div><div class="grid"><div class="card"><div class="l">'+(dv?"A pagar":"A receber")+'</div><div class="v">'+R(ap)+'</div></div><div class="card"><div class="l">Atrasado</div><div class="v" style="color:'+(at?"var(--rd)":"var(--tx)")+'">'+R(at)+'</div></div><div class="card luc" style="grid-column:span 2"><div class="l">'+(dv?"Já pago":"Já recebido")+'</div><div class="v">'+R(rc)+'</div></div></div><button class="btn full" style="margin-top:10px" onclick="openLoan()">'+(dv?"+ Nova dívida":"+ Novo empréstimo")+'</button><h2>Pessoas</h2>'+(LS().length?LS().slice().reverse().map(loanHTML).join(""):'<div class="empty">Nenhum empréstimo lançado.</div>')}
document.getElementById("app").innerHTML=h;
 document.getElementById("nav").innerHTML=[["home","🏠 Painel"],["hist","📊 Histórico"],["wallet","👛 Carteira"],["jobs","💻 Informática"],["loans","💸 Empréstimos"],["stock","📦 Estoque"]].map(function(x){return'<button class="'+(TAB===x[0]?"on":"")+'" onclick="TAB=\''+x[0]+'\';render()">'+'<span style="font-size:18px;display:block">'+x[1].split(" ")[0]+'</span>'+x[1].split(" ")[1]+'</button>'}).join("")}
function serr(m){var e=document.getElementById("serr");if(e)e.textContent=m}
function setIni(){var q=parseInt(document.getElementById("ini").value,10);if(isNaN(q)||q<0)return serr("Informe uma quantidade válida.");var ini=S.stock.filter(function(m){return m.type==="initial"})[0];var old=ini?ini.qty:0;if(stock()-old+q<0)return serr("Essa quantidade deixaria o estoque negativo.");if(ini)ini.qty=q;else S.stock.push({id:uid(),date:today(),qty:q,type:"initial"});save();render()}
function addRep(){var q=parseInt(document.getElementById("rep").value,10);if(isNaN(q)||q<1)return serr("Informe uma quantidade válida.");S.stock.push({id:uid(),date:today(),qty:q,type:"restock"});save();render()}
function delRep(id){var m=S.stock.filter(function(x){return x.id===id})[0];if(stock()-m.qty<0){alert("Não é possível excluir: o estoque ficaria negativo.");return}if(!confirm("Excluir esta reposição?"))return;S.stock=S.stock.filter(function(x){return x.id!==id});save();render()}
function setPrice(){var p=money(document.getElementById("pr").value);if(isNaN(p)||p<=0)return serr("Informe um preço válido.");S.price=p;save();serr("Preço salvo.")}
function delSale(id){if(!confirm("Excluir esta venda? O estoque será devolvido."))return;S.sales=S.sales.filter(function(s){return s.id!==id});save();render()}
var PAY="dinheiro",EDIT=null;
function openSale(id){
 EDIT=id?S.sales.filter(function(s){return s.id===id})[0]:null;
 var s=EDIT||{date:today(),time:nowT(),qty:1,amount:S.price,pay:"dinheiro"};PAY=s.pay;
 var m=document.createElement("div");m.className="modal";m.id="modal";
 m.innerHTML='<div class="sheet"><div class="row"><h1>'+(EDIT?"Editar venda":"Nova venda")+'</h1><button class="btn s sm" onclick="closeM()">Fechar</button></div>'+
 '<div class="row" style="align-items:flex-end"><div style="flex:1"><label>Data</label><input id="fd" type="date" value="'+s.date+'"></div><div style="flex:1"><label>Horário</label><input id="ft" type="time" value="'+s.time+'"></div></div>'+
 '<label>Quantidade de maços (estoque: '+(stock()+(EDIT?EDIT.qty:0))+')</label><input id="fq" type="number" min="1" inputmode="numeric" value="'+s.qty+'" oninput="qChg()">'+
 '<label>Valor recebido (R$)</label><input id="fa" inputmode="decimal" value="'+(s.amount/100).toFixed(2).replace(".",",")+'" oninput="prev()">'+
 '<label>Forma de pagamento</label><div class="seg" id="fp"><button data-p="dinheiro" onclick="setP(\'dinheiro\')">Dinheiro</button><button data-p="pix" onclick="setP(\'pix\')">Pix</button></div>'+
 '<div class="prev"><div>Faturamento<b id="pf"></b></div><div>Custo (50%)<b id="pc"></b></div><div>Lucro (50%)<b id="pl"></b></div></div><div class="err" id="ferr"></div><button class="btn full" onclick="saveSale()">Salvar venda</button></div>';
 document.body.appendChild(m);setP(PAY);prev()}
function closeM(){var m=document.getElementById("modal");if(m)m.remove()}
function setP(p){PAY=p;document.querySelectorAll("#fp button").forEach(function(b){b.className=b.dataset.p===p?"on":""})}
function qChg(){var q=parseInt(document.getElementById("fq").value,10);if(!isNaN(q)&&q>0){document.getElementById("fa").value=(q*S.price/100).toFixed(2).replace(".",",")}prev()}
function prev(){var a=money(document.getElementById("fa").value);if(isNaN(a))a=0;document.getElementById("pf").textContent=R(a);document.getElementById("pc").textContent=R(cost(a));document.getElementById("pl").textContent=R(profit(a))}
function saveSale(){
 var q=parseInt(document.getElementById("fq").value,10),a=money(document.getElementById("fa").value),d=document.getElementById("fd").value,t=document.getElementById("ft").value,e=document.getElementById("ferr");
 if(!d||!t){e.textContent="Informe data e horário.";return}
 if(isNaN(q)||q<1){e.textContent="Informe a quantidade de maços.";return}
 if(isNaN(a)||a<=0){e.textContent="Informe o valor recebido.";return}
 var disp=stock()+(EDIT?EDIT.qty:0);
 if(q>disp){e.textContent="Estoque insuficiente: restam "+disp+" maços.";return}
 if(EDIT){EDIT.date=d;EDIT.time=t;EDIT.qty=q;EDIT.amount=a;EDIT.pay=PAY}
 else S.sales.push({id:uid(),date:d,time:t,qty:q,amount:a,pay:PAY});
 save();closeM();render()}
function sumE(l){var a=0;l.forEach(function(x){a+=x.amount});return a}
